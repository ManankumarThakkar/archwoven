name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # reads packageManager from package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm typecheck
      - run: pnpm test
      # Check 14 parity: the same relevant quality checks run in local (private) mode.
      # Quota suites are hosted-only BY DESIGN (quotas compile out in local mode, §15),
      # so the parity scope is model/extract/ingest/llm + web lib/render.
      - run: ARCHWOVEN_MODE=local pnpm vitest run packages apps/web/lib apps/web/app/lib apps/web/probes
      - run: pnpm bench:selftest

  deploy-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The local-deployment image must build (§8); ollama is a separate service, not baked in.
      - run: docker build -t archwoven-local .
