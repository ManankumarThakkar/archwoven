name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # The spending ledger tests run their Lua scripts against a real Redis.
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      ARCHWOVEN_TEST_REDIS: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - name: Verify visual-review evidence package
        working-directory: benchmarks/ordinary-model-floor/review
        run: sha256sum --check SHA256SUMS
      - uses: pnpm/action-setup@v4 # reads packageManager from package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod
      - run: pnpm -r build
      - name: Exercise isolated serverless dependency bundle (no provider calls)
        run: pnpm hosting:preflight
      - run: pnpm typecheck
      - run: pnpm test
      # Local mode skips hosted-only quota suites; keep shared logic and rendering checks.
      - run: ARCHWOVEN_MODE=local pnpm vitest run packages apps/web/lib apps/web/app/lib
      - run: pnpm bench:selftest
      # Deterministic repair checks use the built model package.
      - run: node benchmarks/repair-rounds/harness.selftest.mjs

  deploy-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The local-deployment image must build; ollama is a separate service, not baked in.
      - name: Build from a development-shaped context
        run: |
          mkdir -p apps/web/node_modules apps/web/.next-context-canary packages/model/dist
          printf 'context-only\n' > apps/web/.env.docker-context-canary
          printf 'context-only\n' > apps/web/node_modules/archwoven-context-canary
          printf 'context-only\n' > apps/web/.next-context-canary/archwoven-context-canary
          printf 'context-only\n' > packages/model/dist/archwoven-context-canary
          docker build -t archwoven-local .
      - name: Check secrets and host-generated artifacts stayed outside the image
        run: |
          docker run --rm archwoven-local node -e '
            const fs = require("node:fs");
            for (const path of ["apps/web/.env.docker-context-canary", "apps/web/node_modules/archwoven-context-canary", "apps/web/.next-context-canary/archwoven-context-canary", "packages/model/dist/archwoven-context-canary"])
              if (fs.existsSync(path)) throw new Error("Host-only build input leaked into image: " + path);
          '
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Exercise actual Compose startup, private boundary and local repository failure recovery
        run: node scripts/compose-smoke.mjs
