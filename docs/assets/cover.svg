  </g>
  <rect x="824" y="557" width="663" height="108" rx="14" fill="#fbf8f2"/>
  <path d="m848 589 6 6 12-14" stroke="#176753" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="880" y="594" fill="#12594a" font-size="19" font-weight="600">Keep the reasoning with the diagram.</text>
  <text x="848" y="632" fill="#56665f" font-size="17">Inspect evidence. Make an edit. Export what you know.</text>
  <text x="822" y="761" fill="#56665f" font-size="14" letter-spacing="1">ARCHITECTURE · SEQUENCE · DATA MODEL · DETAIL</text>
</g>
