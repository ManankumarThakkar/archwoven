# Private-mode deployment (§8): the whole stack runs inside your boundary.
# One manual step before first run:
#   docker compose exec ollama ollama pull gpt-oss:120b   (~65 GB, local inference)
services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      ARCHWOVEN_MODE: local
      OLLAMA_URL: http://ollama:11434
      ARCHWOVEN_DEMO_ACK: "1" # explicit opt-in: local mode in production (boot guard ack)
      ARCHWOVEN_DB: /app/data/archwoven.db
    volumes:
      - ./data:/app/data
    depends_on:
      - ollama
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama

volumes:
  ollama-models:
