# Private-mode deployment (§8): the whole stack runs inside your boundary.
# One manual step before first run:
#   docker compose exec ollama ollama pull gpt-oss:20b   (~13 GB, local inference)
#   Override with OLLAMA_MODEL on the web service (e.g. gpt-oss:120b on ≥64 GB machines).
services:
  web:
    image: archwoven-local
    build: .
    ports:
      - "127.0.0.1:3000:3000" # loopback only (§9): local mode reads folders on this machine
    environment:
      ARCHWOVEN_MODE: local
      OLLAMA_URL: http://ollama:11434
      ARCHWOVEN_DEMO_ACK: "1" # explicit opt-in: local mode in production (boot guard ack)
      ARCHWOVEN_DB: /app/data/archwoven.db
    volumes:
      - ./data:/app/data
      # Import local clones by mounting them read-only, then enter /repos/<project> in Import repository → Local folder:
      # - ~/code:/repos:ro
    depends_on:
      - ollama
  ollama:
    image: ollama/ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama

volumes:
  ollama-models:
